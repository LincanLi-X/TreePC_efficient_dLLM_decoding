[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treepc"
version = "0.6.0"
description = "Posterior-consistent structured diffusion decoding for Dream and LLaDA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<2.12",
  "transformers==4.48.0",
  "accelerate>=1.0,<2.0",
  "peft==0.14.0",
  "safetensors>=0.5,<0.6",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "networkx>=3.0"]
assets = ["huggingface_hub>=0.28"]
evaluation = ["math-verify==0.8.0", "antlr4-python3-runtime==4.13.2", "datasets>=3,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not model'"
markers = [
  "cuda: requires CUDA",
  "model: loads external model weights and benchmark data",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
